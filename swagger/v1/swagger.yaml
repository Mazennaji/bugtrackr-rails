---
openapi: 3.0.1
info:
  title: BugTrackr API
  version: v1
  description: A Jira/Trello-style issue tracker and Kanban project management API
servers:
- url: http://localhost:3000
  description: Development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
paths:
  "/api/v1/auth/register":
    post:
      summary: Register a new user
      tags:
      - Authentication
      security: []
      parameters: []
      responses:
        '201':
          description: user registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  example: '123456'
                password_confirmation:
                  type: string
                  example: '123456'
              required:
              - name
              - email
              - password
              - password_confirmation
  "/api/v1/auth/login":
    post:
      summary: Login user
      tags:
      - Authentication
      security: []
      parameters: []
      responses:
        '200':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  example: '123456'
              required:
              - email
              - password
  "/api/v1/teams/{team_id}/projects/{project_id}/issues":
    parameters:
    - name: team_id
      in: path
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List all issues
      tags:
      - Issues
      security:
      - bearerAuth: []
      parameters:
      - name: q[title_cont]
        in: query
        required: false
        description: Search by title
        schema:
          type: string
      - name: q[priority_eq]
        in: query
        required: false
        description: Filter by priority
        schema:
          type: string
      - name: q[assignee_id_eq]
        in: query
        required: false
        description: Filter by assignee
        schema:
          type: integer
      responses:
        '200':
          description: issues listed
    post:
      summary: Create an issue
      tags:
      - Issues
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: issue created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Fix login bug
                description:
                  type: string
                  example: JWT token not refreshing
                priority:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  - critical
                due_date:
                  type: string
                  format: date-time
                assignee_id:
                  type: integer
                column_id:
                  type: integer
              required:
              - title
              - column_id
  "/api/v1/teams/{team_id}/projects/{project_id}/issues/{id}/move":
    parameters:
    - name: team_id
      in: path
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Move issue to another column
      tags:
      - Issues
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: issue moved
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                column_id:
                  type: integer
                  example: 2
              required:
              - column_id
  "/api/v1/teams":
    get:
      summary: List all teams
      tags:
      - Teams
      security:
      - bearerAuth: []
      responses:
        '200':
          description: teams listed
    post:
      summary: Create a team
      tags:
      - Teams
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: team created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: My Team
              required:
              - name
  "/api/v1/teams/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Get a team
      tags:
      - Teams
      security:
      - bearerAuth: []
      responses:
        '200':
          description: team found
    patch:
      summary: Update a team
      tags:
      - Teams
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: team updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
    delete:
      summary: Delete a team
      tags:
      - Teams
      security:
      - bearerAuth: []
      responses:
        '200':
          description: team deleted
